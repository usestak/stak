packages:
  - 'apps/*'
  - 'packages/*'
  # Isolated architecture-spike prototypes (Phase 14B0). Validated by the normal
  # turbo pipeline but imported by nothing that ships. See experiments/*/README.md.
  - 'experiments/*'
allowBuilds:
  esbuild: true
  sharp: false
# Force patched versions of Next.js transitive deps (web app only; the published
# CLI has no runtime dependencies). We use neither a CSS pipeline (postcss) nor
# next/image (sharp), so these bumps are non-functional but clear advisories.
overrides:
  postcss: '>=8.5.23'
  sharp: '>=0.35.4'
