name: Memory tests (Linux)

# Runs the Memory and CLI test suites on Linux. Its main job is the Memory lock's
# Ctrl+C (SIGINT) cleanup test, which can't run on Windows and is skipped there.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build every package except the web app (its build needs production env).
      # The lock tests' child processes import @stack/memory's own dist/.
      - run: pnpm turbo run build --filter=!@stack/web

      # Listed on its own with the verbose reporter so the log shows the SIGINT
      # test actually ran (not skipped).
      - name: Memory lock tests (incl. Ctrl+C cleanup)
        run: pnpm --filter @stack/memory exec vitest run src/memory-lock.test.ts --reporter=verbose

      - name: Memory, CLI and Cloud test suites
        # Run every suite even if one fails, then fail the step at the end.
        run: |
          status=0
          for pkg in @stack/memory @memstk/cli @stack/cloud-server @stack/cloud-client @stack/spec; do
            echo "::group::$pkg"
            pnpm --filter "$pkg" test || { echo "::error::$pkg tests failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Typecheck
        run: |
          pnpm --filter @stack/memory exec tsc --noEmit -p .
          pnpm --filter @memstk/cli exec tsc --noEmit -p .
