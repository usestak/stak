name: Tests (Linux + macOS)

# Runs the Memory, CLI, Cloud and Skill-tree test suites on Linux and macOS. It covers
# the Memory lock's Ctrl+C (SIGINT) cleanup test, which can't run on Windows, and the
# symlink and case-folding tests for Skill archives and trees, which skip on Windows
# machines without symlink privilege. macOS runners use case-insensitive APFS.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
        exclude:
          # One Node version is enough on macOS (APFS coverage) and keeps the run cheap.
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build every package except the web app (its build needs production env).
      # The lock tests' child processes import @stack/memory's own dist/.
      - run: pnpm turbo run build --filter=!@stack/web

      # Listed on its own with the verbose reporter so the log shows the SIGINT
      # test actually ran (not skipped).
      - name: Memory lock tests (incl. Ctrl+C cleanup)
        run: pnpm --filter @stack/memory exec vitest run src/memory-lock.test.ts --reporter=verbose

      - name: Memory, CLI, Cloud and Skill-tree test suites
        # Run every suite even if one fails, then fail the step at the end.
        run: |
          status=0
          for pkg in @stack/memory @memstk/cli @stack/cloud-server @stack/cloud-client @stack/spec @stack/shared @stack/store @stack/scanner; do
            echo "::group::$pkg"
            pnpm --filter "$pkg" test || { echo "::error::$pkg tests failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Typecheck
        run: |
          pnpm --filter @stack/memory exec tsc --noEmit -p .
          pnpm --filter @memstk/cli exec tsc --noEmit -p .
