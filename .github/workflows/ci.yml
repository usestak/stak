name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          STAK_APP_URL: https://www.memstk.com

      - name: CLI smoke (self-contained bundle)
        run: node packages/cli/dist/bin.js --version

  cli-package-smoke:
    name: packed CLI install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          STAK_APP_URL: https://www.memstk.com
      - name: Pack and install into an isolated directory
        shell: bash
        run: |
          set -euo pipefail
          tgz="$(cd packages/cli && npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          mkdir -p "$RUNNER_TEMP/rc" && cd "$RUNNER_TEMP/rc"
          echo '{"name":"rc","private":true}' > package.json
          npm install "$RUNNER_TEMP/$tgz" --no-save
          ./node_modules/.bin/stak --version
          ./node_modules/.bin/stak scan --help

  demos:
    name: controlled demonstrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          STAK_APP_URL: https://www.memstk.com
      - name: Configure Git identity for demo authoring repos
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "Stack CI"
      - name: Phase 7 multi-agent demo
        run: node scripts/phase7-controlled-demo.mjs
      - name: Phase 8 two-machine cloud demo
        run: node scripts/phase8-controlled-demo.mjs
      - name: Phase 9 public ecosystem demo
        run: node scripts/phase9-controlled-demo.mjs
      - name: Phase 10 comprehensive V0 demo
        run: node scripts/phase10-controlled-demo.mjs
