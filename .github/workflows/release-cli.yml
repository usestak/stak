name: Release CLI (beta)

# Publishes @memstk/cli to npm under the `beta` dist-tag. It never moves `latest`.
#
# Run it by hand: Actions → "Release CLI (beta)" → Run workflow (on main).
# It publishes whatever version packages/cli/package.json holds on main, so merge the
# version-bump PR first. Checklist: docs/release-checklist.md.
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored anywhere.
# npm only accepts this workflow file, from usestak/stak, in the `npm` environment.
#
# The workflow only STAGES the version (`npm stage publish`). Nothing reaches users until
# an owner approves it on npm with 2FA (npmjs.com, or `npm stage approve <id>`).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @memstk/cli to beta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Add required reviewers to this environment in the repo settings for a second
    # approval click before anything is published.
    environment: npm
    permissions:
      contents: write # push the v<version> Git tag
      id-token: write # npm trusted publishing
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main (it was started on ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # `npm stage publish` needs npm 12.
      - name: Use npm 12
        run: |
          npm install -g npm@12
          npm --version

      - name: Check the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          echo "Version on main: $version"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::$version is not a beta version (expected X.Y.Z-beta.N). Stable releases are not published by this workflow."
            exit 1
          fi
          if npm view "@memstk/cli@$version" version >/dev/null 2>&1; then
            echo "::error::@memstk/cli@$version is already on npm. Merge a version bump first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      # The CLI and every package it bundles. The web app is not part of the CLI.
      - run: pnpm turbo run build --filter=@memstk/cli...

      - name: Typecheck and test the CLI
        run: |
          pnpm --filter @memstk/cli exec tsc --noEmit -p .
          pnpm --filter @memstk/cli test

      - name: Check the built CLI reports the right version
        shell: bash
        run: |
          set -euo pipefail
          built="$(node packages/cli/dist/bin.js --version)"
          if [[ "$built" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::Built CLI says $built, expected ${{ steps.version.outputs.version }}."
            exit 1
          fi

      - name: Check the packed CLI installs and runs
        shell: bash
        run: |
          set -euo pipefail
          tgz="$(cd packages/cli && npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          mkdir -p "$RUNNER_TEMP/rc" && cd "$RUNNER_TEMP/rc"
          echo '{"name":"rc","private":true}' > package.json
          npm install "$RUNNER_TEMP/$tgz" --no-save
          ./node_modules/.bin/stak --version

      - name: Stage on npm (beta)
        working-directory: packages/cli
        run: npm stage publish --tag beta

      # Skipped (not failed) when the tag exists, e.g. re-staging after a rejected stage.
      - name: Tag the release in Git
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::warning::Git tag $tag already exists; leaving it as it is."
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Staged @memstk/cli@${{ steps.version.outputs.version }} for \`beta\`"
            echo
            echo "It is NOT live yet. Approve it on npmjs.com (package → staged versions),"
            echo "or from a terminal with npm 12:"
            echo
            echo '```'
            echo 'npm stage list @memstk/cli'
            echo 'npm stage approve <stage-id>'
            echo '```'
            echo
            echo "Then check with \`npm view @memstk/cli dist-tags\`."
          } >> "$GITHUB_STEP_SUMMARY"
